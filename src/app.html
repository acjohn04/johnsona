<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Adam Johnson — I build high-performing engineering teams and scale robust frontend architectures." />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&text=groupsarchitectureflowchartlight_modedark_mode&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body>
		<script>
			const t = localStorage.getItem('theme');
			if (t === 'light' || t === 'dark') {
				document.documentElement.setAttribute('data-theme', t);
			} else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
				document.documentElement.setAttribute('data-theme', 'dark');
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
